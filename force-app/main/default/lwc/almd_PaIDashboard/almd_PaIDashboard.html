<template>
    <div class="slds-m-around_medium">
        
        <!-- Dashboard Page Header -->
        <div class="slds-page-header slds-m-bottom_large slds-box slds-theme_default slds-shadow_small" style="border-radius: 0.5rem;">
            <div class="slds-page-header__row">
                <div class="slds-page-header__col-title">
                    <div class="slds-media slds-media_center">
                        <div class="slds-media__figure">
                            <lightning-icon icon-name="standard:data_integration_hub" size="medium" alternative-text="Dashboard"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <div class="slds-page-header__name">
                                <div class="slds-page-header__name-title">
                                    <h1>
                                        <span class="slds-page-header__title slds-truncate" title="Almond Autos Sync Dashboard">PaI Dashboard</span>
                                    </h1>
                                </div>
                            </div>
                            <p class="slds-page-header__name-meta">Manage and synchronize Supabase data directly to Salesforce</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sync Action Cards -->
        <lightning-layout multiple-rows pull-to-boundary="small">
            
            <!-- Products Sync Card -->
            <lightning-layout-item size="12" medium-device-size="6" padding="around-small">
                <article class="slds-card slds-card_boundary custom-card">
                    <div class="slds-card__header slds-grid">
                        <header class="slds-media slds-media_center slds-has-flexi-truncate">
                            <div class="slds-media__figure">
                                <lightning-icon icon-name="standard:product" size="small"></lightning-icon>
                            </div>
                            <div class="slds-media__body">
                                <h2 class="slds-card__header-title">
                                    <span class="slds-text-heading_small slds-truncate">Products Sync</span>
                                </h2>
                            </div>
                        </header>
                    </div>
                    <div class="slds-card__body slds-card__body_inner slds-m-bottom_medium slds-text-color_weak">
                        Sync products and their associated inventories.
                    </div>
                    <footer class="slds-card__footer custom-footer">
                        <lightning-button 
                            variant="brand" 
                            label="Sync Products & Inventory" 
                            icon-name="utility:sync" 
                            onclick={handleProductSync}
                            class="full-width-button">
                        </lightning-button>
                    </footer>
                </article>
            </lightning-layout-item>

            <!-- Inventory Sync Card -->
            <lightning-layout-item size="12" medium-device-size="6" padding="around-small">
                <article class="slds-card slds-card_boundary custom-card">
                    <div class="slds-card__header slds-grid">
                        <header class="slds-media slds-media_center slds-has-flexi-truncate">
                            <div class="slds-media__figure">
                                <lightning-icon icon-name="standard:orders" size="small"></lightning-icon>
                            </div>
                            <div class="slds-media__body">
                                <h2 class="slds-card__header-title">
                                    <span class="slds-text-heading_small slds-truncate">Inventory Sync</span>
                                </h2>
                            </div>
                        </header>
                    </div>
                    <div class="slds-card__body slds-card__body_inner slds-m-bottom_medium slds-text-color_weak">
                        Sync current inventory levels directly from Supabase to ensure accurate real-time stock counts.
                    </div>
                    <footer class="slds-card__footer custom-footer">
                        <lightning-button 
                            variant="brand" 
                            label="Sync Inventory" 
                            icon-name="utility:sync" 
                            onclick={handleInventorySync}
                            class="full-width-button">
                        </lightning-button>
                        <template if:true={isLoading}>
                        <lightning-spinner
                            alternative-text="Syncing inventory">
                        </lightning-spinner>
                    </template>
                    </footer>
                </article>
            </lightning-layout-item>

        </lightning-layout>
    </div>
</template>
