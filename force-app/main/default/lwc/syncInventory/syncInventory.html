<template>
    <lightning-card title="Inventory Sync">
        <div class="slds-p-around_medium">
            <lightning-button
                label="Sync from Supabase"
                variant="brand"
                onclick={handleSync}
                disabled={isLoading}>
            </lightning-button>
            <template if:true={isLoading}>
                <lightning-spinner
                    alternative-text="Syncing inventory">
                </lightning-spinner>
            </template>
        </div>
    </lightning-card>
</template>
