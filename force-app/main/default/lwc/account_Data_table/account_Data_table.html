<template>
    <div class = 'slds-p-around_large'>
         
    <lightning-card title = 'Account'>
        
       <lightning-button 
       slot='actions'
        label= 'New'
        variant = 'brand'
        onclick={handleNew}>
        </lightning-button>
       
        <div class='slds-m-around_medium'>
            <template if:true={error}>
                <div class='error-box'>
                <p> Please contact Admin
                </p>
                </div>
            </template>
            <template if:true={hasAccounts}>
                <lightning-datatable
                key-field='Id'
                data={accounts}
                columns={columns}
                onrowselection={handleRowSelection}
                onrowaction={handleActions}
                >
                </lightning-datatable>
            </template>
        </div>
        <template if:true={isNew}>
              <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class='slds-modal__container'>
                <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close"
                            title="Close" onclick={closeNewModal}>
                            <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                        <h2 class="slds-text-heading_medium">Edit Account</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-record-edit-form
                            record-id={selectedRecordId}
                            object-api-name="Account"
                            onsuccess={handleSuccess}>
                            <lightning-messages></lightning-messages>
                             <div class="slds-grid slds-wrap ">
                              <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                 <lightning-input-field field-name="Name"></lightning-input-field>
                              </div>
                              <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                <lightning-input-field field-name="Industry"></lightning-input-field>
                              </div>
                              <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                <lightning-input-field field-name="Phone"></lightning-input-field>
                              </div>
                             <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                <lightning-input-field field-name="ALMD_Compliance__c"></lightning-input-field>
                             </div>
                            </div>
                            <div class="slds-align_absolute-center slds-m-top_medium">
                                <button class="slds-button slds-button_neutral" onclick={closeNewModal}>
                                    Cancel
                                </button>
                                <button class="slds-button slds-button_brand" type="submit">
                                    Save
                                </button>
                            </div>
                        </lightning-record-edit-form>
                    </div>
            </div>
              </section>
              <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </lightning-card>
    </div>
</template>
