<template>
<lightning-card>
    <template if:true={hasOpp}>
    </template>
    <template for:each={opp} for:item="oppo">
     <div key ={oppo.Id} class="slds-col slds-p-around_small">
         <div class="slds-col slds-p-around_small">
            <br> OpportunityName : {oppo.name}</br>
            <br> Opportunity Date :{oppo.closingdays}</br>
          <div class="slds-col slds-p-around_small">
             <lightning-combobox
            name="progress"
            label="Status"
            data-id={oppo.Id}
            value={oppo.selectedRegion}
            placeholder="Select Progress"
            options={countryOptions}
            onchange={handleChangeRegion} ></lightning-combobox>

          </div>
          <div class="slds-col slds-p-around_small">
           <br>Estimated days : {oppo.estimatedDays}</br>
            <br>Courier partner : {oppo.courier}</br>
             
          </div>
         </div>
     </div>
    </template>
    
</lightning-card>
</template>
