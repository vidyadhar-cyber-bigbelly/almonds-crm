name: Deploy to DEV2

on:
  pull_request:
    types: [ closed ]
    branches: [ DEV2 ]

jobs:
  deploy:
    # Only run if the PR was merged
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Authenticate to DEV2
        run: |
          echo "${{ secrets.SFDX_AUTH_URL_DEV2 }}" > sfdx_auth
          sf org login sfdx-url -f sfdx_auth -a TargetOrg

      - name: Evaluate Manifest and Deploy
        run: |
          MANIFEST_PATH="manifest/package.xml"
          if [ ! -f "$MANIFEST_PATH" ]; then
            MANIFEST_PATH="package.xml"
          fi
          
          if [ ! -f "$MANIFEST_PATH" ]; then
            echo "❌ ERROR: No package.xml found."
            exit 1
          fi

          echo "🔍 Scanning manifest file at: $MANIFEST_PATH"

          # 1. BULLETPROOF REGEX: Ignores spaces and capitalization
          APEX_CHANGED=$(grep -iE 'ApexClass|ApexTrigger' "$MANIFEST_PATH" || true)
          
          # 2. Try to get tests from tests.txt
          TEST_CLASSES=$(cat tests.txt 2>/dev/null | tr '\n' ' ' | xargs || true)
          
          # 3. BULLETPROOF AUTO-DETECT: Ignores spaces
          if [ -n "$APEX_CHANGED" ] && [ -z "$TEST_CLASSES" ]; then
            echo "⚠️ tests.txt is empty or missing. Auto-detecting test classes from $MANIFEST_PATH..."
            TEST_CLASSES=$(grep -iE '<members>\s*.*Test.*\s*</members>' "$MANIFEST_PATH" | sed -E 's/.*<members>\s*(.*)\s*<\/members>.*/\1/i' | tr '\n' ' ' | xargs || true)
          fi
          
          # Temporarily disable crash-on-error so we can capture the JSON even if tests fail
          set +e 
          
          if [ -n "$APEX_CHANGED" ]; then
            if [ -z "$TEST_CLASSES" ]; then
              echo "❌ ERROR: Apex components found in package.xml, but no test classes could be found in tests.txt or package.xml."
              exit 1
            else
              echo "✅ Apex detected. Deploying manifest with tests: $TEST_CLASSES"
              sf project deploy start --target-org TargetOrg --manifest "$MANIFEST_PATH" --test-level RunSpecifiedTests --tests $TEST_CLASSES --json > deploy-result.json
            fi
          else
            if [ -n "$TEST_CLASSES" ]; then
              echo "✅ No Apex in manifest, but tests provided. Deploying with: $TEST_CLASSES"
              sf project deploy start --target-org TargetOrg --manifest "$MANIFEST_PATH" --test-level RunSpecifiedTests --tests $TEST_CLASSES --json > deploy-result.json
            else
              echo "✅ No Apex in manifest and no tests detected. Deploying declarative changes only."
              sf project deploy start --target-org TargetOrg --manifest "$MANIFEST_PATH" --json > deploy-result.json
            fi
          fi
          
          # Re-enable crash-on-error
          set -e

      - name: Generate Deployment Metrics Dashboard
        if: always() # Ensures the dashboard generates even if deployment throws an error
        run: |
          cat << 'EOF' > parse-metrics.js
          const fs = require('fs');
          if (!fs.existsSync('deploy-result.json')) {
              console.log('No deployment results found.');
              process.exit(0);
          }
          const data = JSON.parse(fs.readFileSync('deploy-result.json', 'utf8'));
          
          let md = '## 🚀 Salesforce Deployment Summary\n\n';
          
          // 1. Handle Top-Level Errors 
          if (data.status !== 0 && data.message) {
              md += '### ❌ Deployment Error\n';
              md += '```text\n' + data.message + '\n```\n\n';
          }
          
          const details = data.result?.details || {};
          const runTestResult = details.runTestResult || {};
          const codeCoverage = runTestResult.codeCoverage || [];
          
          // 2. Component Summary
          let successes = details.componentSuccesses || [];
          if (!Array.isArray(successes)) successes = [successes];
          
          let failures = details.componentFailures || [];
          if (!Array.isArray(failures)) failures = [failures];
          
          md += '### 📦 Component Summary\n';
          md += '- **Total Components Deployed:** ' + successes.length + '\n';
          if (failures.length > 0) {
              md += '- **Total Components Failed:** ' + failures.length + ' ❌\n';
          }
          md += '\n';
          
          // 3. Test & Coverage Summary
          if (runTestResult.numTestsRun > 0) {
              md += '### 🧪 Apex Test Summary\n';
              md += '- **Tests Run:** ' + runTestResult.numTestsRun + '\n';
              md += '- **Passed:** ' + (runTestResult.numTestsRun - (runTestResult.numFailures || 0)) + '\n';
              md += '- **Failed:** ' + (runTestResult.numFailures || 0) + '\n';
              md += '- **Total Time:** ' + runTestResult.totalTime + ' ms\n\n';
              
              if (codeCoverage.length > 0) {
                  md += '### 📊 Apex Code Coverage\n';
                  md += '| Class/Trigger | Coverage % | Status |\n';
                  md += '|---|---|---|\n';
                  codeCoverage.forEach(cov => {
                      let total = cov.numLocations || 0;
                      let uncovered = cov.numLocationsNotCovered || 0;
                      let covered = total - uncovered;
                      let percent = total > 0 ? Math.round((covered / total) * 100) : 0;
                      let status = percent >= 75 ? '🟢 Pass' : '🔴 Fail';
                      md += '| ' + cov.name + ' | ' + percent + '% | ' + status + ' |\n';
                  });
                  md += '\n';
              }
          }
          
          // Inject the markdown into GitHub's built-in UI
          fs.writeFileSync(process.env.GITHUB_STEP_SUMMARY, md, {flag: 'a'});
          EOF
          node parse-metrics.js

      - name: Enforce Final Status
        run: |
          cat << 'EOF' > enforce-status.js
          const fs = require('fs');
          if (fs.existsSync('deploy-result.json')) {
              const data = JSON.parse(fs.readFileSync('deploy-result.json', 'utf8'));
              if (data.status !== 0) {
                  console.error('❌ Deployment failed according to Salesforce CLI.');
                  process.exit(1);
              }
          }
          EOF
          node enforce-status.js