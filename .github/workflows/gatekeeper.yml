name: VG Approval Gatekeeper

on:
  pull_request_review:
    types: [submitted]

jobs:
  gatekeeper-check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Approver Identity
        run: |
          if [ "${{ github.event.review.state }}" == "approved" ]; then
            if [ "${{ github.event.review.user.login }}" != "vidyadhar-cyber-bigbelly" ]; then
              echo "❌ ERROR: Unauthorized approval. Only VG is allowed to approve PRs."
              exit 1
            else
              echo "✅ Approved by VG. Merge is now unlocked."
            fi
          else
            echo "Review submitted, but not an approval."
          fi